[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-recommendation-system"
version = "0.1.0"
description = "Fashion recommendation system — retrieval + ranking pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
notebooks = [
    "pyspark>=3.4.0,<3.5",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]
training = [
    "tensorflow>=2.15,<2.17",
    "tensorflow-recommenders>=0.7.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "mlflow>=2.10",
    "optuna>=3.5",
    "sagemaker>=2.200",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]
