# Optuna search space for XGBoost ranker HPO.
# Trial 0 is enqueued separately with configs/models/ranking.yaml defaults.

n_estimators:
  type: int
  low: 50
  high: 500

learning_rate:
  type: float
  low: 0.01
  high: 0.5
  log: true

max_depth:
  type: int
  low: 4
  high: 12

min_child_weight:
  type: float
  low: 1.0
  high: 10.0

subsample:
  type: float
  low: 0.5
  high: 1.0

colsample_bytree:
  type: float
  low: 0.5
  high: 1.0

reg_lambda:
  type: float
  low: 0.1
  high: 10.0
  log: true
