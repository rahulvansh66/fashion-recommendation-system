# Optuna search space for two-tower retrieval HPO.
# Trial 0 is enqueued separately with configs/models/two_tower.yaml defaults.

learning_rate:
  type: float
  low: 1.0e-4
  high: 1.0e-2
  log: true

embedding_dim:
  type: categorical
  choices: [16, 32, 64]

batch_size:
  type: categorical
  choices: [512, 1024, 2048]

weight_decay:
  type: float
  low: 1.0e-4
  high: 1.0e-2
  log: true

epochs:
  type: int
  low: 5
  high: 15
